name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTEXT.md"
      - "ROADMAP.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          # 仓库未提交 uv.lock（见 .gitignore），默认按 uv.lock 建缓存键
          # 会报 "No file matched"；文档构建很快，直接关闭缓存。
          enable-cache: false
      # Zensical（Material for MkDocs 团队的后继项目）直接读取 mkdocs.yml。
      # --only-group docs：只装文档依赖，不安装项目本体及 ASR 重依赖。
      - name: Build docs (strict)
        run: uv run --only-group docs zensical build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
