[project]
name = "subforge"
version = "0.5.0"
description = "Local Japanese-to-Chinese subtitle translation for doujin audio and ASMR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "lxtoa" }
]
dependencies = [
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "tqdm>=4.0",
    "click>=8.0",
    "starlette>=0.46",
    "uvicorn>=0.34",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/LosLiSang/subforge"
Repository = "https://github.com/LosLiSang/subforge"
Issues = "https://github.com/LosLiSang/subforge/issues"

[project.scripts]
subforge = "subforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "/subforge",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["subforge"]
artifacts = [
    "subforge/ui/templates/*.html",
    "subforge/ui/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true
