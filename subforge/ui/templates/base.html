<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}SubForge Library{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if is_frame %}
<main class="frame-main">{% block content %}{% endblock %}</main>
<script>window.SUBFORGE_CSRF={{ csrf_token|tojson }};</script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
{% else %}
<header>
  <a class="brand" href="/" target="content-frame"><span class="brand-mark">S</span>SubForge</a>
  <nav>
    <a href="/" target="content-frame">作品库</a>
    <a href="/profiles" target="content-frame">翻译配置</a>
    <a href="/settings" target="content-frame">设置</a>
  </nav>
</header>
<iframe id="content-frame" name="content-frame" src="/" title="内容"></iframe>
<div id="player-bar" hidden></div>
<script>window.SUBFORGE_CSRF={{ csrf_token|tojson }};</script>
<script src="/static/app.js"></script>
<script src="/static/global-player.js"></script>
{% endif %}
</body>
</html>
