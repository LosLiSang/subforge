{% if is_frame %}
<title>{{ self.title() }}</title>
<main id="main-content" class="frame-main">
{{ self.content() }}
<script>window.SUBFORGE_CSRF={{ csrf_token|tojson }};</script>
</main>
{{ self.scripts() }}
{% else %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}SubForge Library{% endblock %}</title>
  <link rel="icon" href="/static/subforge-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v=4">
  <link rel="stylesheet" href="/static/theme-overrides.css?v=4">
  <script src="/static/vendor/htmx.min.js"></script>
  <script>
    if (window.htmx) {
      htmx.config.refreshOnHistoryMiss = true;
    }
  </script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
<div class="shell" hx-boost="true" hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML" hx-push-url="true">
  <aside class="sidebar">
    <a class="brand" href="/"><img class="brand-icon" src="/static/subforge-icon.svg" alt=""><span class="brand-text">SubForge</span></a>
    <nav class="side-nav">
      <a href="/" data-nav="/" data-label="作品库"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>作品库</a>
      <a href="/profiles" data-nav="/profiles" data-label="翻译配置"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>翻译配置</a>
      <a href="/creators" data-nav="/creators" data-label="创作者"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>创作者</a>
      <a href="/settings" data-nav="/settings" data-label="设置"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>设置</a>
      <a href="/stats" data-nav="/stats" data-label="统计"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>统计</a>
      <a href="/downloads" data-nav="/downloads" data-label="任务中心"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>任务中心</a>
      <a href="/about" data-nav="/about" data-label="关于"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>关于</a>
    </nav>
    <div class="appearance-controls">
      <div class="accent-picker" data-accent-picker aria-label="强调色">
        <button type="button" data-accent="blue" aria-label="柔和蓝" title="柔和蓝"></button>
        <button type="button" data-accent="cyan" aria-label="青蓝" title="青蓝"></button>
        <button type="button" data-accent="green" aria-label="青绿" title="青绿"></button>
        <button type="button" data-accent="violet" aria-label="柔紫" title="柔紫"></button>
        <button type="button" data-accent="amber" aria-label="琥珀" title="琥珀"></button>
        <button type="button" data-accent="rose" aria-label="玫红" title="玫红"></button>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"/></svg>
        <span data-theme-label>白色主题</span>
      </button>
    </div>
  </aside>
  <main id="main-content" class="frame-main">
    {% block content %}{% endblock %}
  </main>
  <div id="content-frame" style="display:none" aria-hidden="true"></div>
</div>
<div id="player-bar" hx-preserve="true" hx-boost="true" hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML" hx-push-url="true" hidden></div>
<script>window.SUBFORGE_CSRF={{ csrf_token|tojson }};</script>
<script src="/static/app.js?v=6"></script>
<script src="/static/global-player.js"></script>
<script src="/static/float-lyrics.js"></script>
{% block scripts %}{% endblock %}
<script>
/* 侧边栏高亮：匹配当前 location.pathname */
const navLinks = [...document.querySelectorAll('.side-nav a')];
function highlightNav(path) {
  if (!path) path = window.location.pathname;
  const exact = navLinks.find(a => path === a.dataset.nav || (a.dataset.nav !== '/' && path.startsWith(a.dataset.nav + '/')));
  const fallback = navLinks.find(a => a.dataset.nav === '/');
  const target = exact || fallback;
  for (const a of navLinks) a.classList.toggle('active', a === target);
}
highlightNav();
window.addEventListener('htmx:afterOnLoad', () => highlightNav());
window.addEventListener('htmx:pushedIntoHistory', () => highlightNav());
window.addEventListener('popstate', () => highlightNav());
window.addEventListener('htmx:historyRestore', () => {
  highlightNav();
  if (window.Alpine) {
    window.Alpine.initTree(document.body);
  }
  if (window.initTabs) {
    window.initTabs(document.body);
  }
});
document.addEventListener('htmx:afterSwap', (e) => {
  if (window.Alpine && e.detail.target) {
    window.Alpine.initTree(e.detail.target);
  }
  if (window.initTabs && e.detail.target) {
    window.initTabs(e.detail.target);
  }
  if (window.SubForgeApp && window.SubForgeApp.initWidgets) {
    window.SubForgeApp.initWidgets(e.detail.target);
  }
});
</script>
</body>
</html>
{% endif %}
